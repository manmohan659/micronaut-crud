name: Assignment 5 - CI after approved PR merge

on:
  pull_request_target:
    branches:
      - main
      - jdbc
    types:
      - closed

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  test-build-jar:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.CI_DB_NAME }}
          MYSQL_USER: ${{ secrets.CI_DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p${{ secrets.CI_DB_ROOT_PASSWORD }} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Ensure PR had at least one approval
        uses: actions/github-script@v7
        with:
          script: |
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const latestByUser = new Map();
            for (const review of reviews) {
              latestByUser.set(review.user.login, review.state);
            }
            const approved = [...latestByUser.values()].includes('APPROVED');
            if (!approved) {
              core.setFailed('Merged PR had no APPROVED review.');
            }

      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build, test, and create JAR
        env:
          DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/${{ secrets.CI_DB_NAME }}
          DATASOURCES_DEFAULT_USERNAME: ${{ secrets.CI_DB_USERNAME }}
          DATASOURCES_DEFAULT_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: ./gradlew clean build shadowJar --no-daemon

      - name: Resolve JAR path
        id: jar
        run: |
          JAR_PATH="$(ls -1 build/libs/*all.jar 2>/dev/null | head -n1 || true)"
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH="$(ls -1 build/libs/*.jar 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$JAR_PATH" ]; then
            echo "No JAR found in build/libs"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload JAR as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar-${{ github.sha }}
          path: ${{ steps.jar.outputs.path }}

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && secrets.AWS_REGION != '' && secrets.S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' && secrets.AWS_REGION != '' && secrets.S3_BUCKET != '' }}
        run: aws s3 cp "${{ steps.jar.outputs.path }}" "s3://${{ secrets.S3_BUCKET }}/jars/${{ github.sha }}.jar"
