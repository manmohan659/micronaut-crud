name: Assignment 5 - CI after PR merge

on:
  pull_request_target:
    branches:
      - main
      - jdbc
    types:
      - closed

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  test-build-jar:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      CI_DB_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
      CI_DB_NAME: ${{ secrets.CI_DB_NAME }}
      CI_DB_USERNAME: ${{ secrets.CI_DB_USERNAME }}
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.CI_DB_NAME }}
          MYSQL_USER: ${{ env.CI_DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build, test, and create JAR
        env:
          DATASOURCES_DEFAULT_URL: jdbc:mysql://127.0.0.1:3306/${{ env.CI_DB_NAME }}
          DATASOURCES_DEFAULT_USERNAME: ${{ env.CI_DB_USERNAME }}
          DATASOURCES_DEFAULT_PASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: ./gradlew clean build shadowJar --no-daemon

      - name: Resolve JAR path
        id: jar
        run: |
          JAR_PATH="$(ls -1 build/libs/*all.jar 2>/dev/null | head -n1 || true)"
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH="$(ls -1 build/libs/*.jar 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$JAR_PATH" ]; then
            echo "No JAR found in build/libs"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload JAR as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: micronaut-crud-jar-${{ github.sha }}
          path: ${{ steps.jar.outputs.path }}

      - name: Prepare Docker context for GHCR
        run: |
          cp "${{ steps.jar.outputs.path }}" app.jar
          cat > Dockerfile.ghcr <<'EOF'
          FROM eclipse-temurin:21-jre
          WORKDIR /app
          COPY app.jar /app/app.jar
          EXPOSE 8080
          ENTRYPOINT ["java","-jar","/app/app.jar"]
          EOF

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ghcr
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Configure AWS credentials
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.AWS_REGION != '' && env.S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' && env.AWS_REGION != '' && env.S3_BUCKET != '' }}
        run: aws s3 cp "${{ steps.jar.outputs.path }}" "s3://${{ env.S3_BUCKET }}/jars/${{ github.sha }}.jar"
